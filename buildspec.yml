version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm install -g ecs-cli

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      
  build:
    commands:
      - echo Build started on `date`
      
      # Build firelens-datajet image (repository already available from CodeBuild source)
      - echo Building firelens-datajet image...
      - make release
      - docker tag amazon/firelens-datajet:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/datajet:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/datajet:latest
      
      # Build mountebank image
      - echo Building mountebank image...
      - cd apps/mountebank-mock
      - make release
      - docker tag mock-mountebank:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/mock-mountebank:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/mock-mountebank:latest
      - cd ../..
      
      # Configure stability test
      - echo Configuring stability test...
      - cd apps/firelens-stability
      - npm install

  post_build:
    commands:
      - echo Build completed on `date`
